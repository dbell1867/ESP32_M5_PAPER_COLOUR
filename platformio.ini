; ============================================================================
;  M5Stack PaperColor (SKU C151) — ESP32-S3R8, 16MB flash, 8MB octal PSRAM,
;  4" E Ink Spectra 6 (400x600). Pins: see include/board_pins.h
; ============================================================================

[env:papercolor]
; Re-applies the M5GFX e-paper busy-timeout fix (20 s -> 60 s) before each build.
extra_scripts = pre:tools/patch_m5gfx.py
; Modern Arduino core 3.x via the community pioarduino platform.
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board     = esp32-s3-devkitc-1
framework = arduino

; Match the real flash chip (16MB); use the standard 16MB partition layout.
; (Newest pioarduino 55.03.312+ needs PlatformIO Core >= 6.2; we have 6.1.19.)
board_build.flash_size  = 16MB
board_upload.flash_size = 16MB
board_build.partitions  = default_16MB.csv

; 8MB OCTAL PSRAM ("R8"). M5GFX refuses to drive this panel without it
; (the 400x600 frame buffer lives in PSRAM). Enabled now so Stage 1 proves it.
board_build.arduino.memory_type = qio_opi

build_flags =
	-DBOARD_HAS_PSRAM
	; Native USB: expose Serial over the USB-C port itself.
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200

; M5Unified = board glue (power chip, buttons, RTC...); M5GFX = graphics +
; the ED2208 Spectra 6 panel driver. Pinned exactly: both already include
; PaperColor support, and e-paper drivers are not something to float on.
lib_deps =
	m5stack/M5GFX @ 0.2.31
	m5stack/M5Unified @ 0.2.24
